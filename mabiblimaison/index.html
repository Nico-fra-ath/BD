<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma BDthèque — Édition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F7F3E9; --ink:#191A1E; --red:#D7263D; --blue:#1B4F72; --yellow:#F4B400; --green:#2A9D5C; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; padding-bottom:50px;}
  header{background:var(--ink); color:var(--paper); padding:26px 20px 22px; border-bottom:3px solid var(--ink);}
  header h1{font-family:'Bangers',cursive; font-size:2.4rem; margin:0; color:var(--yellow); text-shadow:3px 3px 0 var(--red); transform:rotate(-1.5deg); display:inline-block;}
  header p{margin:6px 0 0; opacity:0.85; font-size:0.9rem;}
  main{max-width:640px; margin:0 auto; padding:20px 16px;}
  .panel{background:#fff; border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink); padding:18px; margin-bottom:22px;}
  .panel h2{margin:0 0 12px; font-size:1.0rem; text-transform:uppercase; letter-spacing:0.5px; border-bottom:2px solid var(--ink); padding-bottom:6px;}
  button{font-family:'Inter',sans-serif; font-weight:700; border:3px solid var(--ink); background:var(--yellow); color:var(--ink); padding:10px 15px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); font-size:0.9rem;}
  button:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  button.secondary{background:#fff;}
  button.danger{background:var(--red); color:#fff;}
  button.small{padding:5px 9px; font-size:0.75rem; box-shadow:2px 2px 0 var(--ink);}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  input[type=text]{flex:1; min-width:160px; padding:10px 12px; border:2px solid var(--ink); font-size:0.95rem;}
  select{padding:8px; border:2px solid var(--ink); font-family:'Inter',sans-serif; font-size:0.85rem;}
  #reader{width:100%; border:2px dashed var(--ink); margin-top:12px;}
  #scan-flash{
    position:absolute; inset:0; margin-top:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:5rem; color:var(--green); background:rgba(255,255,255,0.85);
    opacity:0; pointer-events:none; transition:opacity .15s ease;
  }
  #scan-flash.show{ opacity:1; }
  #scan-status{font-size:0.85rem; margin-top:8px; opacity:0.75;}
  .series-group{margin-bottom:20px;}
  .series-title{font-family:'Bangers',cursive; font-size:1.2rem; margin:0 0 8px; color:var(--blue); border-bottom:2px solid var(--ink); padding-bottom:4px;}
  .book-list{list-style:none; padding:0; margin:0;}
  .book{border:2px solid var(--ink); padding:10px; margin-bottom:10px; background:#fffdf8; transition:background .4s ease;}
  .book.highlight{background:#FFF3C4;}
  .book-top{display:flex; gap:12px;}
  .book img{width:52px; height:74px; object-fit:cover; border:2px solid var(--ink); flex-shrink:0; background:#eee;}
  .book .info{flex:1; min-width:0;}
  .book .info h3{margin:0 0 4px; font-size:0.95rem; line-height:1.2;}
  .book .info p{margin:0; font-size:0.78rem; opacity:0.7;}
  .book .isbn-tag{display:inline-block; background:var(--blue); color:#fff; font-size:0.68rem; padding:2px 6px; margin-top:5px;}
  .book-controls{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap;}
  .field-label{font-size:0.7rem; opacity:0.6; display:block; margin-top:8px; margin-bottom:2px;}
  .note-input, .series-input{width:100%; padding:6px 8px; border:2px solid var(--ink); font-size:0.82rem;}
  #count{background:var(--red); color:#fff; font-size:0.75rem; padding:2px 8px; margin-left:8px;}
  #dup-message{background:var(--yellow); border:2px solid var(--ink); padding:8px 12px; font-size:0.85rem; margin-top:10px; display:none;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<header>
  <h1>Ma BDthèque</h1>
  <p>Écran d'édition — scan, notes, avis</p>
</header>
<main>

  <div class="panel">
    <h2>Ajouter une BD</h2>
    <div class="row">
      <button id="btn-start-scan">📷 Scanner un code-barre</button>
      <button id="btn-stop-scan" class="secondary hidden">Arrêter la caméra</button>
    </div>
    <div id="scan-area" class="hidden">
      <div id="reader-wrap" style="position:relative;">
        <div id="reader"></div>
        <div id="scan-flash">✓</div>
      </div>
    </div>
    <p id="scan-status"></p>
    <div id="dup-message"></div>
    <div class="row" style="margin-top:10px;">
      <input type="text" id="manual-isbn" placeholder="Ou saisissez l'ISBN manuellement">
      <button id="btn-manual-add">Ajouter</button>
    </div>
  </div>

  <div class="panel">
    <h2>Ma collection <span id="count">0</span></h2>
    <div class="row" style="margin-bottom:12px;">
      <input type="text" id="search" placeholder="Rechercher un titre, un auteur, une série...">
    </div>
    <div id="groups"></div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
// ==========================================================
// COLLEZ ICI L'URL DE VOTRE DÉPLOIEMENT APPS SCRIPT (se termine par /exec)
// Doit être EXACTEMENT LA MÊME URL que dans index.html
// ==========================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxUWVtEWRGd7ti_JLFW_rFplt7X2kB3unbIA7IOlfcq3s-N10DFhJvvRZ4ngnPmru4R/exec';

// Doit correspondre à EDIT_SLUG dans Code.gs
const EDIT_KEY = 'mabiblimaison';

let allBooks = [];
let html5QrCode = null;

async function callApi(action, data){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action, key: EDIT_KEY }, data || {}))
  });
  const json = await res.json();
  if(!json.success) throw new Error(json.error || 'Erreur inconnue');
  return json;
}

async function getBooksApi(){
  const res = await fetch(API_URL);
  const json = await res.json();
  if(!json.success) throw new Error(json.error || 'Erreur inconnue');
  return json.books;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function refresh(){
  allBooks = await getBooksApi();
  render();
}

function groupBySeries(books){
  const groups = {};
  books.forEach(b=>{
    const key = b.series && b.series.trim() ? b.series.trim() : 'Sans série';
    if(!groups[key]) groups[key] = [];
    groups[key].push(b);
  });
  const keys = Object.keys(groups).sort((a,b)=>{
    if(a === 'Sans série') return 1;
    if(b === 'Sans série') return -1;
    return a.localeCompare(b, 'fr');
  });
  keys.forEach(k => groups[k].sort((a,b)=> (a.title||'').localeCompare(b.title||'', 'fr')));
  return { groups, keys };
}

function bookCard(b){
  return `
    <li class="book" data-isbn-card="${escapeHtml(b.isbn)}">
      <div class="book-top">
        <img src="${b.cover||''}" onerror="this.style.visibility='hidden'">
        <div class="info">
          <h3>${escapeHtml(b.title || 'Titre inconnu')}</h3>
          <p>${escapeHtml(b.authors || 'Auteur inconnu')}</p>
          <span class="isbn-tag">${escapeHtml(b.isbn)}</span>
        </div>
      </div>
      <div class="book-controls">
        <select data-isbn="${b.isbn}" class="status-select">
          <option value="" ${!b.status ? 'selected' : ''}>— Avis —</option>
          <option value="Aimé" ${b.status==='Aimé' ? 'selected' : ''}>👍 Aimé</option>
          <option value="Pas aimé" ${b.status==='Pas aimé' ? 'selected' : ''}>👎 Pas aimé</option>
        </select>
        <select data-isbn="${b.isbn}" class="possession-select">
          <option value="Possédé" ${b.possession!=='Non possédé' ? 'selected' : ''}>Possédé</option>
          <option value="Non possédé" ${b.possession==='Non possédé' ? 'selected' : ''}>Non possédé</option>
        </select>
        <button class="small danger" data-isbn="${b.isbn}" data-action="delete">Supprimer</button>
      </div>
      <span class="field-label">Série</span>
      <input type="text" class="series-input" data-isbn="${b.isbn}" placeholder="Nom de la série (optionnel)" value="${escapeHtml(b.series)}">
      <span class="field-label">Note personnelle</span>
      <input type="text" class="note-input" data-isbn="${b.isbn}" placeholder="Votre note..." value="${escapeHtml(b.note)}">
    </li>`;
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const container = document.getElementById('groups');
  document.getElementById('count').textContent = allBooks.length;

  const filtered = allBooks.filter(b=>{
    if(!q) return true;
    return (b.title||'').toLowerCase().includes(q)
      || (b.authors||'').toLowerCase().includes(q)
      || (b.series||'').toLowerCase().includes(q);
  });

  container.innerHTML = '';
  const { groups, keys } = groupBySeries(filtered);
  keys.forEach(key=>{
    const section = document.createElement('div');
    section.className = 'series-group';
    section.innerHTML = `<h2 class="series-title">${escapeHtml(key)}</h2><ul class="book-list">${groups[key].map(bookCard).join('')}</ul>`;
    container.appendChild(section);
  });
}

document.getElementById('search').addEventListener('input', render);

document.getElementById('groups').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-action="delete"]');
  if(!btn) return;
  if(!confirm('Supprimer cette BD de la collection ?')) return;
  await callApi('delete', { isbn: btn.dataset.isbn });
  await refresh();
});

document.getElementById('groups').addEventListener('change', async (e)=>{
  if(e.target.classList.contains('status-select')){
    await callApi('update', { isbn: e.target.dataset.isbn, updates: { status: e.target.value } });
    await refresh();
  }
  if(e.target.classList.contains('possession-select')){
    await callApi('update', { isbn: e.target.dataset.isbn, updates: { possession: e.target.value } });
    await refresh();
  }
});

document.getElementById('groups').addEventListener('blur', async (e)=>{
  if(e.target.classList.contains('note-input')){
    await callApi('update', { isbn: e.target.dataset.isbn, updates: { note: e.target.value } });
  }
  if(e.target.classList.contains('series-input')){
    await callApi('update', { isbn: e.target.dataset.isbn, updates: { series: e.target.value } });
    await refresh();
  }
}, true);

async function lookupIsbn(isbn){
  try{
    const r = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    const data = await r.json();
    const key = `ISBN:${isbn}`;
    if(data[key]){
      const d = data[key];
      return { isbn, title:d.title, authors:(d.authors||[]).map(a=>a.name).join(', '), cover:d.cover?d.cover.medium:'' };
    }
  }catch(e){}
  try{
    const r2 = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
    const data2 = await r2.json();
    if(data2.items && data2.items.length){
      const v = data2.items[0].volumeInfo;
      return { isbn, title:v.title, authors:(v.authors||[]).join(', '), cover:v.imageLinks?v.imageLinks.thumbnail:'' };
    }
  }catch(e){}
  return { isbn, title:'', authors:'', cover:'' };
}

function showDupMessage(text){
  const el = document.getElementById('dup-message');
  el.textContent = text;
  el.style.display = 'block';
  setTimeout(()=>{ el.style.display = 'none'; }, 6000);
}

function scrollToAndHighlight(isbn){
  const card = document.querySelector(`[data-isbn-card="${isbn}"]`);
  if(card){
    card.scrollIntoView({behavior:'smooth', block:'center'});
    card.classList.add('highlight');
    setTimeout(()=> card.classList.remove('highlight'), 2500);
  }
}

async function addIsbn(isbn){
  isbn = isbn.replace(/[^0-9Xx]/g,'');
  if(!isbn) return;

  // Vérification locale immédiate : évite d'attendre le réseau si on l'a déjà
  if(allBooks.some(b => b.isbn === isbn)){
    document.getElementById('scan-status').textContent = '';
    showDupMessage('BD déjà répertoriée — vous pouvez l\'éditer ci-dessous.');
    scrollToAndHighlight(isbn);
    return;
  }

  document.getElementById('scan-status').textContent = `Recherche des informations pour ${isbn}...`;
  const book = await lookupIsbn(isbn);

  try{
    const result = await callApi('add', { book });
    allBooks = result.books;

    if(result.duplicate){
      document.getElementById('scan-status').textContent = '';
      showDupMessage('BD déjà répertoriée — vous pouvez l\'éditer ci-dessous.');
      render();
      scrollToAndHighlight(isbn);
    }else{
      document.getElementById('scan-status').textContent = book.title ? `Ajouté : ${book.title}` : `ISBN ${isbn} ajouté (infos non trouvées).`;
      render();
    }
  }catch(err){
    document.getElementById('scan-status').textContent = 'Erreur : ' + err.message;
  }
}

document.getElementById('btn-manual-add').addEventListener('click', ()=>{
  const val = document.getElementById('manual-isbn').value;
  if(val.trim()){ addIsbn(val.trim()); document.getElementById('manual-isbn').value = ''; }
});
document.getElementById('manual-isbn').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('btn-manual-add').click();
});

let scanLocked = false;
let lastScannedCode = null;
let lastScannedAt = 0;
const SCAN_COOLDOWN_MS = 2500; // ignore le même code pendant 2,5s après un scan

function flashScanConfirmed(){
  const el = document.getElementById('scan-flash');
  if(!el) return;
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 1200);
}

async function handleDecoded(decodedText){
  const now = Date.now();
  // Un traitement est déjà en cours : on ignore toute nouvelle détection
  if(scanLocked) return;
  // Même code que la dernière fois, trop rapproché : probablement le même passage devant la caméra
  if(decodedText === lastScannedCode && (now - lastScannedAt) < SCAN_COOLDOWN_MS) return;

  lastScannedCode = decodedText;
  lastScannedAt = now;
  scanLocked = true;
  flashScanConfirmed(); // confirmation visuelle immédiate, avant même la recherche réseau

  try{
    await addIsbn(decodedText);
  } finally {
    scanLocked = false;
  }
}

document.getElementById('btn-start-scan').addEventListener('click', async ()=>{
  document.getElementById('scan-area').classList.remove('hidden');
  document.getElementById('btn-start-scan').classList.add('hidden');
  document.getElementById('btn-stop-scan').classList.remove('hidden');
  document.getElementById('scan-status').textContent = 'Ouverture de la caméra...';
  html5QrCode = new Html5Qrcode("reader");
  try{
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 120 } },
      (decodedText)=>{ handleDecoded(decodedText); },
      ()=>{}
    );
    document.getElementById('scan-status').textContent = 'Visez le code-barre au dos de la BD.';
  }catch(err){
    document.getElementById('scan-status').textContent = "Impossible d'accéder à la caméra. Utilisez l'ajout manuel ci-dessous.";
  }
});

document.getElementById('btn-stop-scan').addEventListener('click', async ()=>{
  if(html5QrCode){ try{ await html5QrCode.stop(); await html5QrCode.clear(); }catch(e){} }
  document.getElementById('scan-area').classList.add('hidden');
  document.getElementById('btn-start-scan').classList.remove('hidden');
  document.getElementById('btn-stop-scan').classList.add('hidden');
});

refresh();
</script>
</body>
</html>
