<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma BDthèque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F7F3E9; --ink:#191A1E; --red:#D7263D; --blue:#1B4F72; --yellow:#F4B400; --green:#2A9D5C; --grey:#8a8a8a; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; padding-bottom:50px;}
  header{background:var(--ink); color:var(--paper); padding:26px 20px 22px; border-bottom:3px solid var(--ink);}
  header h1{font-family:'Bangers',cursive; font-size:2.4rem; margin:0; color:var(--yellow); text-shadow:3px 3px 0 var(--red); transform:rotate(-1.5deg); display:inline-block;}
  header p{margin:6px 0 0; opacity:0.85; font-size:0.9rem;}
  main{max-width:640px; margin:0 auto; padding:20px 16px;}
  input[type=text]{width:100%; padding:10px 12px; border:2px solid var(--ink); font-size:0.95rem; margin-bottom:14px;}
  button{font-family:'Inter',sans-serif; font-weight:700; border:3px solid var(--ink); background:var(--yellow); color:var(--ink); padding:10px 15px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); font-size:0.9rem; margin-bottom:14px;}
  button:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  .series-group{margin-bottom:22px;}
  .series-title{font-family:'Bangers',cursive; font-size:1.3rem; letter-spacing:0.5px; margin:0 0 8px; color:var(--blue); border-bottom:2px solid var(--ink); padding-bottom:4px;}
  .book-list{list-style:none; padding:0; margin:0;}
  .book{position:relative; display:flex; gap:12px; border:2px solid var(--ink); padding:10px; padding-bottom:34px; margin-bottom:10px; background:#fffdf8;}
  .book img{width:52px; height:74px; object-fit:cover; border:2px solid var(--ink); flex-shrink:0; background:#eee;}
  .book .info{flex:1; min-width:0;}
  .book .info h3{margin:0 0 4px; font-size:0.95rem; line-height:1.2;}
  .book .info p{margin:0; font-size:0.78rem; opacity:0.7;}
  .book .note{font-size:0.78rem; margin-top:5px; font-style:italic; opacity:0.8;}
  .isbn-tag{display:inline-block; background:var(--blue); color:#fff; font-size:0.68rem; padding:2px 6px; margin-top:5px;}
  .possession-tag{
    position:absolute; bottom:8px; right:8px;
    font-size:0.72rem; font-weight:700; padding:3px 8px;
    display:flex; align-items:center; gap:4px;
  }
  .possession-tag.owned{ background:var(--green); color:#fff; }
  .possession-tag.nope{ background:var(--red); color:#fff; }
  .possession-tag.wishlist{ background:var(--yellow); color:var(--ink); }
  #count{background:var(--red); color:#fff; font-size:0.75rem; padding:2px 8px; margin-left:8px;}
  #empty{text-align:center; padding:30px 10px; opacity:0.6; font-size:0.9rem; display:none;}
  .loading{text-align:center; padding:30px; opacity:0.6;}
</style>
</head>
<body>
<header>
  <h1>Ma BDthèque</h1>
  <p>Collection consultable — <span id="count">0</span> album(s) possédé(s)</p>
</header>
<main>
  <input type="text" id="search" placeholder="Rechercher un titre, un auteur ou une série...">
  <div class="row">
    <button id="btn-wishlist-toggle">⭐ Voir la wishlist</button>
  </div>
  <div id="loading" class="loading">Chargement...</div>
  <div id="groups"></div>
  <div id="empty">Aucune BD à afficher.</div>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxUWVtEWRGd7ti_JLFW_rFplt7X2kB3unbIA7IOlfcq3s-N10DFhJvvRZ4ngnPmru4R/exec';

let allBooks = [];
let showWishlistOnly = false;

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function groupBySeries(books){
  const groups = {};
  books.forEach(b=>{
    const key = b.series && b.series.trim() ? b.series.trim() : 'Sans série';
    if(!groups[key]) groups[key] = [];
    groups[key].push(b);
  });
  const keys = Object.keys(groups).sort((a,b)=>{
    if(a === 'Sans série') return 1;
    if(b === 'Sans série') return -1;
    return a.localeCompare(b, 'fr');
  });
  keys.forEach(k => groups[k].sort((a,b)=>{
    const ta = parseInt(a.tome,10), tb = parseInt(b.tome,10);
    const va = isNaN(ta) ? Infinity : ta, vb = isNaN(tb) ? Infinity : tb;
    if(va !== vb) return va - vb;
    return (a.title||'').localeCompare(b.title||'', 'fr');
  }));
  return { groups, keys };
}

function possessionTag(possession){
  if(possession === 'Wishlist') return `<span class="possession-tag wishlist">⭐ Je le veux !</span>`;
  if(possession === "Je n'en veux pas") return `<span class="possession-tag nope">❌ Non merci</span>`;
  return `<span class="possession-tag owned">✅ Déjà possédé</span>`;
}

function bookCard(b){
  return `
    <li class="book">
      <img src="${b.cover||''}" onerror="this.style.visibility='hidden'">
      <div class="info">
        <h3>${escapeHtml(b.title || 'Titre inconnu')}</h3>
        <p>${escapeHtml(b.authors || 'Auteur inconnu')}</p>
        <span class="isbn-tag">${escapeHtml(b.isbn)}</span>
        ${b.note ? `<div class="note">"${escapeHtml(b.note)}"</div>` : ''}
      </div>
      ${possessionTag(b.possession)}
    </li>`;
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const container = document.getElementById('groups');
  document.getElementById('count').textContent = allBooks.filter(b => b.possession === "Je l'ai").length;

  let filtered = allBooks.filter(b=>{
    if(!q) return true;
    return (b.title||'').toLowerCase().includes(q)
      || (b.authors||'').toLowerCase().includes(q)
      || (b.series||'').toLowerCase().includes(q);
  });

  if(showWishlistOnly){
    filtered = filtered.filter(b => b.possession === 'Wishlist');
  }

  document.getElementById('empty').style.display = filtered.length === 0 ? 'block' : 'none';
  container.innerHTML = '';
  if(filtered.length === 0) return;

  const { groups, keys } = groupBySeries(filtered);
  keys.forEach(key=>{
    const section = document.createElement('div');
    section.className = 'series-group';
    section.innerHTML = `<h2 class="series-title">${escapeHtml(key)}</h2><ul class="book-list">${groups[key].map(bookCard).join('')}</ul>`;
    container.appendChild(section);
  });
}

document.getElementById('search').addEventListener('input', render);

document.getElementById('btn-wishlist-toggle').addEventListener('click', ()=>{
  showWishlistOnly = !showWishlistOnly;
  document.getElementById('btn-wishlist-toggle').textContent = showWishlistOnly ? '📚 Voir toute la collection' : '⭐ Voir la wishlist';
  render();
});

async function loadBooks(){
  try{
    const res = await fetch(API_URL);
    const json = await res.json();
    if(!json.success) throw new Error(json.error || 'Erreur inconnue');
    allBooks = json.books;
    document.getElementById('loading').style.display = 'none';
    render();
  }catch(err){
    document.getElementById('loading').textContent = 'Erreur de chargement : ' + err.message;
  }
}

loadBooks();
</script>
</body>
</html>
